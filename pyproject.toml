[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stk-agent"
version = "0.6.7"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "h5py>=3.10,<4",
  "imageio-ffmpeg>=0.5,<0.7",
  "PySuperTuxKart2==0.7.4",
  "pygame>=2.6,<3",
  "PyYAML>=6,<7",
  "gymnasium>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
rl = ["torch>=2.7", "tensorboard", "psutil"]

[project.scripts]
stk-agent = "stk_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
